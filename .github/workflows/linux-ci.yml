name: linux-ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    name: Ubuntu Release (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential g++ cmake \
            libx11-dev libxext-dev libomp-dev \
            python3-dev python3-pip python3-venv

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++ \
            -DHYPERLITE_ENABLE_CUDA=OFF \
            -DHYPERLITE_BUILD_TESTS=ON \
            -DHYPERLITE_BUILD_BENCHMARKS=ON \
            -DHYPERLITE_BUILD_PYTHON_BINDINGS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: CTest (headless)
        env:
          HYPERLITE_HEADLESS: "1"
          DISPLAY: ""
        run: ctest --test-dir build --output-on-failure

      - name: CPU benches (smoke run)
        env:
          HYPERLITE_HEADLESS: "1"
          DISPLAY: ""
        run: |
          ./build/cpu_line_bench
          ./build/primitive_bench

      - name: Python headless smoke
        env:
          HYPERLITE_HEADLESS: "1"
          DISPLAY: ""
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -U pip setuptools wheel
          .venv/bin/pip install .
          .venv/bin/python - <<'PY'
          import hyperlite
          e = hyperlite.Engine(320, 240, "cpu", "ci", present="headless")
          e.begin_frame()
          e.clear(0, 0, 0, 255)
          e.rect_fill(10, 10, 32, 24, 255, 0, 0, 255)
          e.end_frame()
          e.present()
          assert e.is_running()
          print("python_smoke=ok", hyperlite.__file__)
          PY

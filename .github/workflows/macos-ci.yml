name: macos-ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    name: macOS Clang Release (headless)
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DHYPERLITE_ENABLE_CUDA=OFF \
            -DHYPERLITE_BUILD_TESTS=ON \
            -DHYPERLITE_BUILD_BENCHMARKS=ON \
            -DHYPERLITE_BUILD_PYTHON_BINDINGS=ON \
            -DPython3_EXECUTABLE="${{ steps.setup-python.outputs.python-path }}"

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: CTest (headless)
        env:
          HYPERLITE_HEADLESS: "1"
        run: ctest --test-dir build --output-on-failure

      - name: CPU benches (smoke run)
        env:
          HYPERLITE_HEADLESS: "1"
        run: |
          ./build/cpu_line_bench
          ./build/primitive_bench

      - name: Python headless smoke
        env:
          HYPERLITE_HEADLESS: "1"
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install .
          python - <<'PY'
          import hyperlite
          e = hyperlite.Engine(320, 240, "cpu", "ci", present="headless")
          e.begin_frame()
          e.clear(0, 0, 0, 255)
          e.rect_fill(10, 10, 32, 24, 255, 0, 0, 255)
          e.end_frame()
          e.present()
          assert e.is_running()
          g = hyperlite.Game(64, 64, "cpu", "ci", present="headless")
          g.set_max_frames(2)
          g.run()
          print("python_smoke=ok", hyperlite.__file__)
          PY

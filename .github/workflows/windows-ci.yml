name: windows-ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    name: Windows MSVC Release (headless)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # windows-latest ships VS 2026 (generator "Visual Studio 18 2026"); do not
      # hardcode VS 2022 — let CMake select the newest installed VS instance.
      - name: Configure
        run: |
          cmake -S . -B build `
            -A x64 `
            -DHYPERLITE_ENABLE_CUDA=OFF `
            -DHYPERLITE_BUILD_TESTS=ON `
            -DHYPERLITE_BUILD_BENCHMARKS=ON `
            -DHYPERLITE_BUILD_PYTHON_BINDINGS=ON `
            "-DPython3_EXECUTABLE=${{ steps.setup-python.outputs.python-path }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: CTest (headless)
        env:
          HYPERLITE_HEADLESS: "1"
        run: ctest --test-dir build -C Release --output-on-failure

      # Smoke only: no FPS thresholds. Fail on crash / nonzero exit.
      - name: CPU benches (smoke run)
        env:
          HYPERLITE_HEADLESS: "1"
        run: |
          .\build\Release\cpu_line_bench.exe
          .\build\Release\primitive_bench.exe

      - name: Python headless smoke
        env:
          HYPERLITE_HEADLESS: "1"
        shell: bash
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install .
          python - <<'PY'
          import hyperlite
          e = hyperlite.Engine(320, 240, "cpu", "ci", present="headless")
          e.begin_frame()
          e.clear(0, 0, 0, 255)
          e.rect_fill(10, 10, 32, 24, 255, 0, 0, 255)
          e.end_frame()
          e.present()
          assert e.is_running()
          print("python_smoke=ok", hyperlite.__file__)
          PY
